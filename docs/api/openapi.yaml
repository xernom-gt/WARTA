    # ---------------------------------------------------------- Verification
    VerificationItem:
      type: object
      required:
        - id
        - project_id
        - project_title
        - spse_code
        - satker
        - pagu_amount
        - item_type
        - author_display_name
        - narrative
        - votes_agree
        - votes_disagree
        - target_votes
        - voters
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_title:
          type: string
        spse_code:
          type: string
        satker:
          type: string
        pagu_amount:
          $ref: '#/components/schemas/Money'
        item_type:
          $ref: '#/components/schemas/VerificationItemType'
        report_id:
          type: string
          format: uuid
          nullable: true
        claim_id:
          type: string
          format: uuid
          nullable: true
        author_display_name:
          type: string
        category_label:
          type: string
          nullable: true
        narrative:
          type: string
        proposed_address:
          type: string
          nullable: true
        proposed_precision:
          type: string
          enum:
            - kabupaten/kota
            - kecamatan
            - desa/kelurahan
            - alamat/ruas
            - titik
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        distance_from_project_m:
          type: number
          format: double
          nullable: true
        exif_status:
          $ref: '#/components/schemas/ExifStatus'
        exif_notice:
          type: string
          nullable: true
        photo_url:
          type: string
          format: uri
          nullable: true
        votes_agree:
          type: integer
          minimum: 0
        votes_disagree:
          type: integer
          minimum: 0
        target_votes:
          type: integer
          minimum: 1
          example: 3
        voters:
          type: array
          description: Display names of citizens who voted.
          items:
            type: string
        status:
          $ref: '#/components/schemas/VerificationItemStatus'
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
    Vote:
      type: object
      required: [id, verification_item_id, user_id, choice, created_at]
      properties:
        id:
          type: string
          format: uuid
        verification_item_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        choice:
          $ref: '#/components/schemas/VoteChoice'
        created_at:
          type: string
          format: date-time
    CreateVoteRequest:
      type: object
      required: [choice]
      properties:
        choice:
          $ref: '#/components/schemas/VoteChoice'
    VoteResolutionStatus:
      type: string
      description: |
        Current state of the voted item. A report resolves to `terverifikasi`
        or `ditolak`; a location claim resolves to `diterima` or `ditolak`.
      enum: [menunggu, terverifikasi, ditolak, diterima]
    VoteResolution:
      type: object
      description: |
        Current outcome of the verification item, not a snapshot from the
        moment of voting. Always present, including while the item is still
        `menunggu`.
      required: [status, votes_agree, votes_disagree, target_votes, resolved_at]
      properties:
        status:
          $ref: '#/components/schemas/VoteResolutionStatus'
        votes_agree:
          type: integer
          minimum: 0
        votes_disagree:
          type: integer
          minimum: 0
        target_votes:
          type: integer
          minimum: 1
          example: 3
        resolved_at:
          type: string
          format: date-time
          nullable: true
    MyVote:
      type: object
      description: |
        A vote plus the current outcome of the voted item. The vote itself is
        immutable; `resolution` changes as verification progresses. The API
        does not return a "vote won" flag; clients derive it from `choice` and
        `resolution.status`.
      required:
        - id
        - verification_item_id
        - project_id
        - project_title
        - item_type
        - author_display_name
        - choice
        - created_at
        - resolution
      properties:
        id:
          type: string
          format: uuid
        verification_item_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_title:
          type: string
        item_type:
          $ref: '#/components/schemas/VerificationItemType'
        author_display_name:
          type: string
        choice:
          $ref: '#/components/schemas/VoteChoice'
        created_at:
          type: string
          format: date-time
        resolution:
          $ref: '#/components/schemas/VoteResolution'

